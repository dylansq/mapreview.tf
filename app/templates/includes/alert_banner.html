{% if alert_text %}
<div class="alert-container">
    {{alert_text}}
    </div>

    
{% endif %}

{% if not session['display_name'] and alert_login and not session['alert_login_cookie']%}
<div class="alert-container" id="alert_login">
    {{alert_login}}
    <span id="alert-close" style="position:absolute; right: 10px; padding-left:10px; padding-right:10px;z-index: 10;;">x</span>
    </div>
    

<script>
  $('#alert-close').on('click',function () {
    $.post('/alert_close', function(data) {
        
        $('.alert-container').hide();

    });
  });


  
</script>
{% endif %}
